# 持续集成:干净环境安装依赖并跑全部测试。
# 本地开发依赖宿主 app 内置包的符号链接,CI 用公共 npm 验证
# 依赖真实可装、测试离线可跑,两边互补。
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Run tests
        run: npm test
